<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TypeScript Atlas">
  <!-- Carré aux angles arrondis, dans le bleu TypeScript officiel. -->
  <rect width="64" height="64" rx="12" fill="#3178C6" />
  <!-- Boussole stylisée : l'« atlas » qui guide à travers le langage. -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.55" />
  <!-- Aiguille nord-est / sud-ouest. -->
  <path d="M32 14 L38 32 L32 50 L26 32 Z" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="3.5" fill="#3178C6" />
</svg>
