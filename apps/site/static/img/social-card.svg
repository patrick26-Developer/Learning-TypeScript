<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="TypeScript Atlas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Logo -->
  <rect x="96" y="150" width="96" height="96" rx="18" fill="#3178C6" />
  <path d="M144 172 L154.5 198 L144 224 L133.5 198 Z" fill="#FFFFFF" />

  <!-- Titre -->
  <text x="220" y="212" font-family="system-ui, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">
    TypeScript Atlas
  </text>

  <!-- Accroche -->
  <text x="96" y="330" font-family="system-ui, sans-serif" font-size="38" fill="#94a3b8">
    Du premier `let` a l&apos;architecture d&apos;API de production.
  </text>

  <!-- Chiffres cles -->
  <text x="96" y="440" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#6aa9e9">
    21 modules  ·  6 mini-projets  ·  3 projets finaux
  </text>
  <text x="96" y="492" font-family="system-ui, sans-serif" font-size="26" fill="#64748b">
    NestJS  ·  Express  ·  Next.js  ·  React + Vite  ·  Expo  ·  Docker
  </text>

  <!-- Bandeau bilingue -->
  <rect x="96" y="530" width="150" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="171" y="559" font-family="system-ui, sans-serif" font-size="22" fill="#e2e8f0" text-anchor="middle">
    FR / EN
  </text>
</svg>
